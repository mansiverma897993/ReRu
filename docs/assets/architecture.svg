<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="520" viewBox="0 0 1280 520" role="img" aria-label="ReRu request path: clients to RESP2 parser and dispatch, into the shared store, then to snapshots, AOF, RDB, and replicas">
  <title>ReRu request path</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080b10"/>
      <stop offset="1" stop-color="#0f1620"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ef4444"/>
      <stop offset="0.55" stop-color="#f97316"/>
      <stop offset="1" stop-color="#fbbf24"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#f97316"/>
    </marker>
    <clipPath id="frame">
      <rect width="1280" height="520" rx="20"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1280" height="520" fill="url(#bg)"/>
    <rect width="1280" height="520" fill="url(#grid)"/>

    <text x="64" y="52" font-family="'Inter','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="2.4" fill="#6b7a90">REQUEST PATH</text>

    <!-- Clients -->
    <rect x="390" y="80" width="500" height="64" rx="14" fill="#0f1621" stroke="#263244"/>
    <text x="640" y="109" text-anchor="middle" font-family="'Inter','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="19" font-weight="700" fill="#eef2f7">Redis clients</text>
    <text x="640" y="130" text-anchor="middle" font-family="'Inter','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="14" fill="#8b98ab">redis-cli · redis-py · ioredis · Lettuce</text>

    <!-- Parser -->
    <rect x="390" y="178" width="500" height="64" rx="14" fill="#0f1621" stroke="#263244"/>
    <text x="640" y="207" text-anchor="middle" font-family="'Inter','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="19" font-weight="700" fill="#eef2f7">RESP2 parser and command dispatch</text>
    <text x="640" y="228" text-anchor="middle" font-family="'Inter','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="14" fill="#8b98ab">MULTI queue · blocking commands · subscriptions</text>

    <!-- Store -->
    <rect x="310" y="276" width="660" height="92" rx="16" fill="#101a26" stroke="url(#accent)" stroke-width="2"/>
    <text x="640" y="308" text-anchor="middle" font-family="'Inter','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="20" font-weight="700" fill="#ffffff">Shared in-memory store</text>
    <text x="640" y="332" text-anchor="middle" font-family="'Inter','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="14" fill="#94a3b8">command gate · TTL index · eviction policies · client limits</text>

    <!-- Downstream -->
    <rect x="310" y="410" width="200" height="70" rx="13" fill="#0f1621" stroke="#263244"/>
    <text x="410" y="438" text-anchor="middle" font-family="'Inter','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="16" font-weight="700" fill="#eef2f7">Snapshots</text>
    <text x="410" y="458" text-anchor="middle" font-family="'Inter','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#8b98ab">ReRu format (.snap)</text>

    <rect x="540" y="410" width="200" height="70" rx="13" fill="#0f1621" stroke="#263244"/>
    <text x="640" y="438" text-anchor="middle" font-family="'Inter','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="16" font-weight="700" fill="#eef2f7">Append-only file</text>
    <text x="640" y="458" text-anchor="middle" font-family="'Inter','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#8b98ab">replay · online rewrite</text>

    <rect x="770" y="410" width="200" height="70" rx="13" fill="#0f1621" stroke="#263244"/>
    <text x="870" y="438" text-anchor="middle" font-family="'Inter','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="16" font-weight="700" fill="#eef2f7">Redis RDB</text>
    <text x="870" y="458" text-anchor="middle" font-family="'Inter','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#8b98ab">subset · SAVE / BGSAVE</text>

    <rect x="1000" y="284" width="180" height="76" rx="13" fill="#0f1621" stroke="#263244"/>
    <text x="1090" y="313" text-anchor="middle" font-family="'Inter','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="16" font-weight="700" fill="#eef2f7">Replicas</text>
    <text x="1090" y="334" text-anchor="middle" font-family="'Inter','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#8b98ab">snapshot + stream</text>

    <!-- Arrows -->
    <g stroke="#f97316" stroke-width="1.6" stroke-opacity="0.85" fill="none">
      <line x1="640" y1="144" x2="640" y2="172" marker-end="url(#arrow)"/>
      <line x1="640" y1="242" x2="640" y2="270" marker-end="url(#arrow)"/>
      <line x1="410" y1="368" x2="410" y2="404" marker-end="url(#arrow)"/>
      <line x1="640" y1="368" x2="640" y2="404" marker-end="url(#arrow)"/>
      <line x1="870" y1="368" x2="870" y2="404" marker-end="url(#arrow)"/>
      <line x1="970" y1="322" x2="994" y2="322" marker-end="url(#arrow)"/>
    </g>

    <text x="640" y="505" text-anchor="middle" font-family="'Inter','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#63718a">One connection thread per client. Writes are serialized by the command gate and fan out from one write-out point.</text>
  </g>

  <rect x="1" y="1" width="1278" height="518" rx="19" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>
</svg>
